<!DOCTYPE html>
<html lang="en-gb" dir="ltr" class="no-js{% if page.class %} {{ page.class }}{% endif %}">
{% include page-head.html %}
    <body>
        {{ content }}
        <script>

        if (document.documentElement.clientWidth >= 768) {
            var jQueryJs = document.createElement("script"),
                lightboxJs = document.createElement("script");

            jQueryJs.type = "text/javascript";
            jQueryJs.src = "//ajax.googleapis.com/ajax/libs/jquery/2.0.3/jquery.min.js";

            lightboxJs.type = "text/javascript";
            lightboxJs.src = "{{ "assets/js/lightbox-2.6.min.js" | cdn }}";

            jQueryJs.onload = function () {
                $('head').append('<link rel="stylesheet" href="{{ "assets/css/lightbox/lightbox.min.css" | cdn }}" type="text/css" />');
                document.body.appendChild(lightboxJs);
            }

            document.body.appendChild(jQueryJs);
        }
        </script>
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-LXRM3YLD7B"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-LXRM3YLD7B');
        </script>
    </body>
</html>
